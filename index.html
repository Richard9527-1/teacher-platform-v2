<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语文智备Pro</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- PWA：manifest（图标见 icons/icon.svg） -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4a6fa5">
</head>
<body>

  <!-- ===== 登录界面 ===== -->
<div id="loginContainer" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#4a6fa5;z-index:9999;justify-content:center;align-items:center;flex-direction:column;">
  <div style="background:#fff;padding:40px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,0.2);max-width:380px;width:90%;">
    <h2 style="text-align:center;color:#2c3e50;margin-bottom:8px;">📚 语文智备Pro</h2>
    <p style="text-align:center;color:#7f8c8d;margin-bottom:24px;font-size:0.9rem;">请登录您的账号</p>
    <div id="loginError" style="color:#dc3545;text-align:center;margin-bottom:12px;display:none;"></div>
    <input type="text" id="loginUsername" placeholder="用户名" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid #ddd;margin-bottom:12px;font-size:1rem;box-sizing:border-box;" />
    <input type="password" id="loginPassword" placeholder="密码" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid #ddd;margin-bottom:20px;font-size:1rem;box-sizing:border-box;" />
    <button class="btn" id="loginBtn" style="width:100%;padding:12px;font-size:1rem;background:#4a6fa5;color:#fff;border:none;border-radius:8px;cursor:pointer;">登 录</button>
  </div>
</div>

  <div class="header">
  <h1>📚 语文智备Pro</h1>
  <div style="display:flex;align-items:center;gap:12px;flex:1;justify-content:center;padding:0 20px;">
    <!-- 搜索框 -->
    <div style="display:flex;align-items:center;background:rgba(255,255,255,0.2);border-radius:20px;padding:0 16px;height:34px;max-width:400px;width:100%;">
      <input type="text" id="globalSearch" placeholder="搜索课文、作者、类型..." style="border:none;outline:none;background:transparent;color:#ffffff;font-size:0.9rem;padding:0 6px;height:34px;width:100%;font-weight:400;" />
      <button id="searchBtn" style="background:transparent;border:none;color:rgba(255,255,255,0.7);cursor:pointer;font-size:0.9rem;padding:0 4px;height:34px;display:flex;align-items:center;">🔍</button>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="display:flex;align-items:center;gap:6px;color:rgba(255,255,255,0.9);font-size:0.85rem;">
      <i class="fas fa-user-circle" style="font-size:1.3rem;"></i>
    </span>
    <span id="logoutBtn" style="cursor:pointer;font-size:0.8rem;color:rgba(255,255,255,0.8);padding:4px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);">🚪 退出</span>
    <button id="themeToggle" style="background:transparent;border:none;color:rgba(255,255,255,0.8);cursor:pointer;font-size:1.1rem;padding:0 4px;">🌙</button>
  </div>
</div>


  
  <div class="sidebar">
    <ul>
      <li class="active" data-module="dashboard">📊 工作台</li>
      <li data-module="schedule">📅 课程表</li>
      <li data-module="lesson">📑 备课中心</li>
      <li data-module="essay">✍️ 作文批改</li>
      <li data-module="resource">📁 教材资源</li>
      <li data-module="exam">📋 试卷中心</li>
      <li data-module="class">👥 班级管理</li>
      <li data-module="data-analysis">📊 数据分析</span></li>
      <li data-module="todo">⏰ 今日待办</span></li>
      <li data-module="notification">🔔 系统通知</span></li>
      <li data-module="settings">⚙️ 设置中心</li>
    </ul>
  </div>

  <div class="main" id="mainContent"></div>

  <!-- 外部脚本 -->
<script src="js/utils.js"></script>
<script src="js/modules/auth.js"></script>
<!-- 教材数据：轻量索引同步加载（137篇元数据），
     详情（全文/拼音/注释/译文/讲解/赏析/考点）拆分为 data/texts/detail-*.js，
     由 text-loader.js 在打开详情时按需懒加载，避免首屏卡顿 -->
<script src="data/texts-index.js?v=20260803"></script>
<script src="js/modules/text-loader.js?v=20260803"></script>
<script src="js/modules/class-data.js"></script>
<script src="js/modules/dashboard.js"></script>
<script src="js/modules/lesson-plan.js"></script> 
<script src="js/modules/essay.js?v=20260731"></script>
<script src="js/modules/pinyin-data.js"></script>
<script src="js/modules/resource.js?v=20260803"></script>
<script src="js/modules/exam.js"></script>
<script src="js/modules/class.js"></script>
<script src="js/modules/data-analysis.js"></script>
<script src="js/modules/settings.js"></script>
<script src="js/modules/schedule.js?v=20260707"></script>
<script src="js/modules/todo.js"></script>
<script src="js/modules/notification.js"></script>
<script src="js/modules/scoreboard.js"></script>
<script src="js/modules/ocr.js?v=20260731d"></script>
<script src="js/app.js"></script>
  <!-- 可选：Service Worker -->
  <!-- <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script> -->
</body>
</html>
